<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R M PHARMACY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 35px 22px;
      text-align: center;
      background: linear-gradient(180deg, #080808, #111111);
    }

    .logo {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      margin: 10px auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    .logo-text {
      color: #d4af37;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      color: #d4af37;
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 35px;
    }

    .card {
      border: 1px solid #3b3118;
      border-radius: 18px;
      padding: 25px 18px;
      background: #0d0d0d;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.08);
    }

    .card h2 {
      color: #d4af37;
      margin-bottom: 10px;
      font-size: 21px;
    }

    .card p {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .button {
      display: block;
      text-decoration: none;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    .call {
      background: #d4af37;
      color: #000;
    }

    .whatsapp {
      background: #111;
      color: #d4af37;
      border: 1px solid #d4af37;
    }

    .button:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 35px;
      color: #666;
      font-size: 12px;
    }

    .gold-line {
      width: 70px;
      height: 2px;
      background: #d4af37;
      margin: 15px auto 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <div class="logo-text">RM</div>
    </div>

    <h1>R M PHARMACY</h1>

    <div class="gold-line"></div>

    <p class="subtitle">
      Your trusted pharmacy
    </p>

    <div class="card">

      <h2>Contact Us</h2>

      <p>
        For medicines and pharmacy enquiries
      </p>

      <a class="button call" href="tel:9909004151">
        📞 Call 9909004151
      </a>

      <a class="button whatsapp"
         href="https://wa.me/919909004151">
        💬 WhatsApp 9909004151
      </a>

      <a class="button call" href="tel:7096004151">
        📞 Call 7096004151
      </a>

      <a class="button whatsapp"
         href="https://wa.me/917096004151">
        💬 WhatsApp 7096004151
      </a>

    </div>

    <div class="footer">
      © 2026 R M PHARMACY
    </div>

  </div>

</body>
</html>
